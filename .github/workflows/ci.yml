name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Ruby syntax and standalone checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Syntax and standalone checks only. This job does not boot Redmine.
        ruby: ["3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Ruby syntax
        run: find . -name "*.rb" -print0 | xargs -0 -n1 ruby -c
      - name: Standalone checks (no Redmine)
        run: ruby test/standalone/dashboard_stats_standalone_test.rb

  test:
    name: Redmine 7.0.1 plugin tests (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: redmine_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    steps:
      - name: Checkout Redmine 7.0.1
        uses: actions/checkout@v4
        with:
          repository: redmine/redmine
          ref: 7.0.1
          path: redmine

      - name: Install plugin
        uses: actions/checkout@v4
        with:
          path: redmine/plugins/redmine_custom_dashboard

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            default-libmysqlclient-dev \
            pkg-config \
            libyaml-dev

      - name: Configure database
        working-directory: redmine
        run: |
          cat > config/database.yml <<'YAML'
          test:
            adapter: mysql2
            database: redmine_test
            username: root
            password: root
            host: 127.0.0.1
            encoding: utf8mb4
          YAML

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler: "2.6.9"

      - name: Install gems
        working-directory: redmine
        run: |
          bundle config set --local without 'development minimagick'
          bundle install

      - name: Migrate and run plugin tests
        working-directory: redmine
        env:
          RAILS_ENV: test
        run: |
          ruby -v
          bundle exec rake db:migrate redmine:plugins:migrate NAME=redmine_custom_dashboard
          bundle exec rails runner 'puts %(Rails #{Rails.version}); puts %(Redmine #{Redmine::VERSION}); puts %(MySQL #{ActiveRecord::Base.connection.select_value(%q{SELECT VERSION()})})'
          bundle exec rake redmine:plugins:test NAME=redmine_custom_dashboard

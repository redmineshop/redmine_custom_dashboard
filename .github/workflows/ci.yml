name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Syntax and standalone checks only. This job does not boot Redmine.
        ruby: ["3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Ruby syntax
        run: find . -name "*.rb" -print0 | xargs -0 -n1 ruby -c
      - name: Standalone checks (no Redmine)
        run: ruby test/standalone/dashboard_stats_standalone_test.rb
